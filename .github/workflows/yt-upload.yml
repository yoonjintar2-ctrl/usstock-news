name: yt-upload
# yt-queue 브랜치의 q/<key>/ (video.mp4, thumb.jpg, spec.json, job.json) 를 유튜브 API로 올리고, 기록 후 대기열에서 지운다. 맥 필요 없음.
on:
  push:
    branches: [yt-queue]
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: yt-upload, cancel-in-progress: false}
jobs:
  up:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: 올리기
        run: |
          pip install -q requests
          git fetch -q origin yt-queue && git worktree add -q /tmp/q origin/yt-queue
          git config user.name "yt-bot"; git config user.email "yt-bot@users.noreply.github.com"
          for d in /tmp/q/q/*/; do
            [ -f "$d/job.json" ] || continue
            K=$(python3 -c "import json;print(json.load(open('$d/job.json'))['key'])")
            PA=$(python3 -c "import json;print(json.load(open('$d/job.json')).get('publish_at') or '')")
            python3 scripts/video/upload.py "$d/video.mp4" "$d/thumb.jpg" "$d/spec.json" --key "$K" ${PA:+--publish-at $PA} 2>&1 | tee -a /tmp/log.txt
            mkdir -p /tmp/wk && cp "$d/video.mp4" "/tmp/wk/${K//:/_}.mp4"
            rm -rf "$d"
          done
          if [ -n "$(git status --porcelain video/uploaded.json)" ]; then
            git add video/uploaded.json && git commit -qm "유튜브 업로드 기록(API)" && for i in 1 2 3 4; do git pull -q --rebase -X theirs && git push -q && break; sleep 5; done
          fi
          cd /tmp/q && git add -A && (git diff --cached --quiet || git commit -qm "업로드 완료분 비움") && git push -q origin HEAD:yt-queue || true
      - name: 주간 롱폼 재료 보관(8일치)
        if: always()
        run: |
          ls /tmp/wk/*.mp4 >/dev/null 2>&1 || exit 0
          mkdir -p /tmp/keep
          if git fetch -q origin vid-week 2>/dev/null; then git --work-tree=/tmp/keep checkout origin/vid-week -- . 2>/dev/null || true; fi
          cp /tmp/wk/*.mp4 /tmp/keep/
          CUT=$(date -u -d '8 days ago' +%F)
          for f in /tmp/keep/*.mp4; do b=$(basename $f); [[ "${b:0:10}" < "$CUT" ]] && rm -f $f; done
          cd /tmp/keep && git init -q && git checkout -q -b vid-week && git add *.mp4 && git -c user.name=yt-bot -c user.email=yt-bot@users.noreply.github.com commit -qm "주간 재료 $(date -u +%F)" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" vid-week
