name: market-data
on:
  schedule:
    - cron: '10 21 * * 1-5'   # 06:10 KST 화~토 (미 동부 표준시 기준 정규장 마감 10분 뒤)
    - cron: '10 20 * * 1-5'   # 서머타임 기간 05:10 KST
  workflow_dispatch:
  push:
    paths: ['scripts/fetch_market.py', '.github/workflows/market.yml']
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests
      - run: python scripts/fetch_market.py
      - run: |
          git config user.name "market-bot"
          git config user.email "market-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "시세 자동 수집 $(date -u +%F)" && git pull --rebase && git push)
